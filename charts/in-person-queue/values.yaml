image:
  repository: ghcr.io/barakplasma/in-person-queue
  # defaults to the chart's appVersion
  tag: ''
  pullPolicy: IfNotPresent

# State lives in the pod (memory + a snapshot file), so there is always exactly one replica.

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ''
  annotations: {}
  host: queue.example.com
  # name of a TLS secret for host; leave empty for no TLS (geolocation needs HTTPS!)
  tlsSecretName: ''

# Per-client-IP request limit, as a Traefik Middleware on the ingress (Traefik is k3s's default
# ingress controller). Traefik must see real client IPs, otherwise everyone shares one bucket:
# on k3s, set externalTrafficPolicy: Local on the traefik Service.
# Keep it generous: people queueing at one site may share a mobile carrier's NAT IP.
rateLimit:
  enabled: false
  average: 30 # requests per second per client IP
  burst: 60

# Keeps queues across pod restarts and upgrades. Without it, state lives in an emptyDir:
# it survives container restarts but not the pod being replaced.
persistence:
  enabled: true
  size: 64Mi
  storageClass: ''

resources:
  requests: {cpu: 10m, memory: 16Mi}
  limits: {memory: 128Mi}

nodeSelector: {}
tolerations: []
affinity: {}
