{{- if not .Values.externalRedis.existingSecret }}
{{- if and (not .Values.valkey.enabled) (not .Values.externalRedis.url) }}
{{- fail "set externalRedis.url or externalRedis.existingSecret when valkey.enabled=false" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "iq.fullname" . }}
  labels: {{- include "iq.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.valkey.enabled }}
  {{- $password := include "iq.valkeyPassword" . }}
  VALKEY_PASSWORD: {{ $password | quote }}
  REDIS_CONNECTION_STRING: {{ printf "redis://:%s@%s-valkey:6379" $password (include "iq.fullname" .) | quote }}
  {{- else }}
  REDIS_CONNECTION_STRING: {{ .Values.externalRedis.url | quote }}
  {{- end }}
{{- end }}
