# docker compose up --build   -> app on http://localhost:8080
# docker compose up -d valkey -> just the datastore, for `npm run dev`
services:
  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    volumes:
      - valkey-data:/data
    ports:
      - 127.0.0.1:6379:6379
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s

  app:
    build: .
    restart: unless-stopped
    depends_on:
      valkey:
        condition: service_healthy
    ports:
      - 8080:8080
    environment:
      REDIS_CONNECTION_STRING: redis://valkey:6379

volumes:
  valkey-data:
