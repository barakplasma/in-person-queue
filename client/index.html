<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>In-Person-Queue</title>
    <link rel="stylesheet" href="vendor/mvp.css" />
    <script type="module" src="./home.js"></script>
  </head>

  <body>
    <header>
      <h1>In-Person-Queue</h1>
      <a href="https://barakplasma.github.io/in-person-queue/">About</a>
    </header>
    <main>
      <section>
        <aside>
          <h3>Nearby Queues</h3>
          <div id="warning"></div>
          <table id="queues">
            <thead>
              <tr>
                <th>Queue</th>
                <th><img src="destination.png" height="30" alt="" /> Distance</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
          <p>Needs location permissions to find queues near you</p>
        </aside>
      </section>
      <hr />
      <section>
        <label for="closes">Queue closes</label>
        <input type="datetime-local" id="closes" required />
        <button id="becomeAdmin">Create <mark>new</mark> queue at my location</button>
      </section>
    </main>
    <style>
      body {
        text-align: center;
      }
    </style>
  </body>
</html>
