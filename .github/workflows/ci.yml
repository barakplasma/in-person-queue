name: CI

on:
  pull_request:
  push:
    branches: [main]

# a newer push to the same PR cancels the older run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Pull requests run only this: fast checks in one job. It is also the required status check.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # for the chart version check
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
      - uses: azure/setup-helm@v5
      - run: test -z "$(gofmt -l *.go)" || (gofmt -d *.go && exit 1)
      - run: go vet .
      - run: go test .
      - run: npm ci && npx prettier --check . && npx eslint .
      - run: helm lint charts/in-person-queue --strict
      - name: cloudflare/public is the web client (the Deploy to Cloudflare button needs it inside cloudflare/)
        run: |
          npm run assets --prefix cloudflare
          test -z "$(git status --porcelain cloudflare/public)" || (git status cloudflare/public && echo "::error::run npm run assets --prefix cloudflare" && exit 1)
      - name: Chart version bumped when the chart changes
        if: github.event_name == 'pull_request'
        run: |
          base=origin/${{ github.base_ref }}
          if ! git diff --quiet "$base"...HEAD -- charts/in-person-queue; then
            old=$(git show "$base:charts/in-person-queue/Chart.yaml" 2>/dev/null | grep '^version:' || true)
            new=$(grep '^version:' charts/in-person-queue/Chart.yaml)
            if [ "$old" = "$new" ]; then
              echo "::error file=charts/in-person-queue/Chart.yaml::the chart changed; bump 'version' in Chart.yaml"
              exit 1
            fi
          fi

  # main only: the slower, deeper checks, all of which must pass before anything is published.

  go:
    if: github.event_name == 'push'
    strategy:
      matrix:
        # arm64 too: the binary is deployed on ARM servers, and the SQLite driver is per-architecture code
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -race -cover .
      - name: Known vulnerabilities (including the Go standard library)
        run: go run golang.org/x/vuln/cmd/govulncheck@latest .

  e2e:
    if: github.event_name == 'push'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    # keep in sync with the @playwright/test version in package.json
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: npm ci
      - run: npm run test:e2e
      - name: The same tests against the Cloudflare Worker (wrangler dev)
        run: npm ci --prefix cloudflare && npx playwright test -c cloudflare/playwright.config.js

  chart:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - name: Validate rendered manifests (incl. the Traefik Middleware CRD)
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          kubeconform="./kubeconform -strict -summary -schema-location default -schema-location https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json"
          helm template t charts/in-person-queue | $kubeconform
          helm template t charts/in-person-queue --set ingress.enabled=true --set rateLimit.enabled=true | $kubeconform
          helm template t charts/in-person-queue --set persistence.enabled=false | $kubeconform

  image:
    needs: [build, go, e2e, chart]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      # the chart's appVersion is the app's version, and the image tag the chart deploys by default
      - id: version
        run: |
          echo "version=$(sed -nE "s/^appVersion: ['\"]?([^'\"]+)['\"]?$/\1/p" charts/in-person-queue/Chart.yaml)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}:${{ github.sha }}

  publish-chart:
    needs: [image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          repo=oci://ghcr.io/${{ github.repository_owner }}/charts
          version=$(helm show chart charts/in-person-queue | grep '^version:' | cut -d' ' -f2)
          # published chart versions are immutable
          if helm show chart "$repo/in-person-queue" --version "$version" >/dev/null 2>&1; then
            echo "chart $version already published, skipping"
            exit 0
          fi
          helm package charts/in-person-queue
          helm push in-person-queue-*.tgz "$repo"

  # Releases when docs/releases/<appVersion>.md exists and isn't released yet:
  # its first line (a "# " heading) is the title, the rest the notes.
  release:
    needs: [image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -nE "s/^appVersion: ['\"]?([^'\"]+)['\"]?$/\1/p" charts/in-person-queue/Chart.yaml)
          notes=docs/releases/$version.md
          if [ ! -f "$notes" ] || gh release view "$version" >/dev/null 2>&1; then
            echo "no new release for $version"
            exit 0
          fi
          tail -n +2 "$notes" > notes.md
          gh release create "$version" --target "$GITHUB_SHA" --notes-file notes.md --title "$(head -1 "$notes" | sed 's/^# //')"
