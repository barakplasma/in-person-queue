name: Notify homelab-manifests

# After CI succeeds on a push to main (its image job has then published the
# image), tell homelab-manifests to bump its apps/in-person-queue pin (it no
# longer polls). Needs the secret HOMELAB_DISPATCH_TOKEN: a token allowed to
# send repository_dispatch to barakplasma/homelab-manifests. Without it this
# only warns, so it cannot break the build.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions: {}

jobs:
  notify:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          GH_TOKEN: ${{ secrets.HOMELAB_DISPATCH_TOKEN }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::HOMELAB_DISPATCH_TOKEN is not set; not notifying homelab-manifests"
            exit 0
          fi
          gh api repos/barakplasma/homelab-manifests/dispatches \
            -f event_type=in-person-queue-image-published \
            -f "client_payload[sha]=$SHA"
